<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Your Album Critic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span>YOUR</span> ALBUM CRITIC
      </a>
      <a href="index.html" class="btn btn-sm btn-outline-secondary">← Voltar</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="auth-card">
      <div class="text-center mb-4">
        <h3 class="fw-bold">Entrar na sua conta</h3>
        <p class="text-secondary small">Acesse para favoritar álbuns e mais.</p>
      </div>

      <div id="msg-erro" class="alert alert-danger py-2 small" style="display:none"></div>

      <form id="form-login" novalidate>
        <div class="mb-3">
          <label class="form-label text-secondary small">Login</label>
          <input type="text" id="login-input" class="form-control form-control-dark" placeholder="Seu login" autocomplete="username">
        </div>
        <div class="mb-4">
          <label class="form-label text-secondary small">Senha</label>
          <input type="password" id="senha-input" class="form-control form-control-dark" placeholder="Sua senha" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-verde w-100">Entrar</button>
      </form>

      <hr class="border-secondary my-4">
      <p class="text-center text-secondary small mb-0">
        Não tem conta?
        <a href="cadastro_usuario.html" class="text-success fw-bold">Cadastre-se</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/scripts/login.js"></script>
  <script>
    document.getElementById('form-login').addEventListener('submit', fazerLogin);
  </script>
</body>
</html>
