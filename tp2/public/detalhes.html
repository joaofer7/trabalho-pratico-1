<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Álbum | Your Album Critic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top border-bottom border-secondary">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span>YOUR</span> ALBUM CRITIC
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center gap-1">
          <li class="nav-item" id="nav-cadastro-item" style="display:none">
            <a class="nav-link" href="cadastro_itens.html">Cadastro</a>
          </li>
          <li class="nav-item" id="nav-favoritos" style="display:none">
            <a class="nav-link" href="favoritos.html">❤ Favoritos</a>
          </li>
          <li class="nav-item d-flex align-items-center gap-1" id="nav-login">
            <a class="nav-link" href="login.html">Login</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">

    <!-- INFO PRINCIPAL -->
    <div id="detalhe-conteudo" class="mb-5">
      <div class="text-center text-secondary py-5">Carregando álbum...</div>
    </div>

    <!-- FAIXAS -->
    <hr class="border-secondary my-5">
    <h3 class="mb-4" style="color:var(--verde)">Faixas</h3>
    <div class="row g-3" id="secao-faixas"></div>

    <!-- ANÁLISE IA -->
    <hr class="border-secondary my-5">
    <h3 class="mb-4" style="color:var(--verde)">Análise Crítica</h3>
    <div id="analise-ia"></div>

    <!-- CRÍTICA DO USUÁRIO -->
    <hr class="border-secondary my-5">
    <h3 class="mb-4" style="color:var(--verde)">Deixe sua Crítica</h3>
    <div class="p-4 rounded border" style="background:var(--preto-card);border-color:var(--borda)!important">
      <div class="mb-3">
        <label class="form-label text-secondary small">O que você achou deste álbum?</label>
        <textarea class="form-control form-control-dark" id="texto-critica" rows="4"
                  placeholder="Escreva sua análise aqui..."></textarea>
      </div>
      <button type="button" class="btn btn-verde" onclick="salvarCritica()">Publicar Crítica</button>

      <div id="feedback-critica" class="mt-4 d-none">
        <h6 class="text-success">Sua crítica enviada:</h6>
        <p id="exibir-critica" class="fst-italic" style="border-left:3px solid var(--verde);padding-left:12px"></p>
      </div>
    </div>
  </div>

  <footer class="bg-dark py-4 border-top border-secondary mt-5">
    <div class="container text-center text-secondary small">
      <p class="mb-0">© João Vitor Ferreira Fernandes · 2025 · PUC Minas</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/scripts/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', carregarDetalhes);

    function salvarCritica() {
      const texto = document.getElementById('texto-critica').value.trim();
      if (!texto) { alert('Por favor, escreva algo antes de publicar!'); return; }
      document.getElementById('exibir-critica').innerText = texto;
      document.getElementById('feedback-critica').classList.remove('d-none');
      document.getElementById('texto-critica').value = '';
    }
  </script>
</body>
</html>
