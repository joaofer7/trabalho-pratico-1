<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário | Your Album Critic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span>YOUR</span> ALBUM CRITIC
      </a>
      <a href="login.html" class="btn btn-sm btn-outline-secondary">← Voltar ao Login</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="auth-card">
      <div class="text-center mb-4">
        <h3 class="fw-bold">Criar conta</h3>
        <p class="text-secondary small">Junte-se à comunidade de críticos musicais.</p>
      </div>

      <div id="msg-erro-cad" class="alert alert-danger py-2 small" style="display:none"></div>
      <div id="msg-ok-cad" class="alert alert-success py-2 small" style="display:none"></div>

      <form id="form-cadastro" novalidate>
        <div class="mb-3">
          <label class="form-label text-secondary small">Login *</label>
          <input type="text" id="cad-login" class="form-control form-control-dark" placeholder="Escolha um login único">
        </div>
        <div class="mb-3">
          <label class="form-label text-secondary small">Nome completo *</label>
          <input type="text" id="cad-nome" class="form-control form-control-dark" placeholder="Seu nome">
        </div>
        <div class="mb-3">
          <label class="form-label text-secondary small">E-mail *</label>
          <input type="email" id="cad-email" class="form-control form-control-dark" placeholder="seu@email.com">
        </div>
        <div class="mb-4">
          <label class="form-label text-secondary small">Senha *</label>
          <input type="password" id="cad-senha" class="form-control form-control-dark" placeholder="Crie uma senha">
        </div>
        <button type="submit" class="btn btn-verde w-100">Criar conta</button>
      </form>

      <hr class="border-secondary my-4">
      <p class="text-center text-secondary small mb-0">
        Já tem conta?
        <a href="login.html" class="text-success fw-bold">Entrar</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/scripts/login.js"></script>
  <script>
    document.getElementById('form-cadastro').addEventListener('submit', cadastrarUsuario);
  </script>
</body>
</html>
